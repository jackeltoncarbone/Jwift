<!doctype html><canvas id=c></canvas><script type=module>
const gl = document.getElementById('c').getContext('webgl2');
const fs = await (await fetch('panel.frag')).text(), vs = await (await fetch('panel.vert')).text();
const out = [];
for (const defs of [['MATERIAL_GLASS'], ['MATERIAL_NONE'], ['MATERIAL_FLAT'], ['MATERIAL_GLASS','GLASS_NO_GLOW','GLASS_NO_SPEC'], ['MATERIAL_FLAT','NO_SHAPE_GRADIENT'], ['MATERIAL_FLAT','NO_SHAPE_GRADIENT','TWO_STOP_GRADIENT'], ['MATERIAL_FLAT','RIM_ONLY']]) {
  const inject = s => s.replace(/^(#version[^\n]*\n)/, '$1' + defs.map(d => `#define ${d} 1\n`).join(''));
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, inject(s)); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) out.push(defs.join('+') + ': ' + gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) out.push(defs.join('+') + ' link: ' + gl.getProgramInfoLog(p));
}
window.__result = out.length ? out.join('\n') : 'ok';
</script>
