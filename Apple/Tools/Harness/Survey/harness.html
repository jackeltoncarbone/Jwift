<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1200" height="1020"></canvas>
<script type="module">
import { FS_GLASS_V2 } from '../Oliverrr2424_webgl-apple-liquid-glass/src/v2-shaders.js';
const Q = new URLSearchParams(location.search);
const MODEL = Q.get('model') || 'R';
const BG = Q.get('bg') || 'photo';
const DPR = 3, W = 1200, H = 1020;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, antialias: false, preserveDrawingBuffer: true });

// Shapes in device px, DOM orientation. Pill 180x48 CSS; panel 320x160 CSS radius 34 CSS.
const SHAPES = [
  { cx: 600, cy: 190, hx: 270, hy: 72, r: 72, capsule: true },
  { cx: 600, cy: 660, hx: 480, hy: 240, r: 102, capsule: false },
];

const VS = `#version 300 es
in vec2 aPos; void main(){ gl_Position = vec4(aPos,0.,1.); }`;

function compile(fs) {
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) + '\n' + s.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    gl.attachShader(p, sh);
  }
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = (p, n) => gl.getUniformLocation(p, n);

function texFrom(img, srgb, mips) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, srgb ? gl.SRGB8_ALPHA8 : gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (mips) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}
function target() {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f };
}

// Separable Gaussian with optional saturation matrix (harness-only prep; cost not counted).
const BLUR = compile(`#version 300 es
precision highp float; out vec4 o; uniform sampler2D uT; uniform vec2 uDir; uniform float uSigma; uniform float uSat; uniform vec2 uRes;
void main(){ vec2 uv = gl_FragCoord.xy/uRes; vec4 acc = vec4(0.); float ws = 0.;
  int n = int(ceil(uSigma*3.0));
  for (int i=-120;i<=120;i++){ if (abs(i)>n) continue; float w = uSigma<0.01 ? (i==0?1.:0.) : exp(-float(i*i)/(2.*uSigma*uSigma)); acc += texture(uT, uv + uDir*float(i)/uRes)*w; ws += w; }
  vec4 c = acc/ws;
  if (uSat != 1.0) { float s = uSat; vec3 k = vec3(0.213,0.715,0.072)*(1.-s); mat3 m = mat3(k.x+s,k.x,k.x, k.y,k.y+s,k.y, k.z,k.z,k.z+s); c.rgb = clamp(m*c.rgb,0.,1.); }
  o = c; }`);
function blurred(src, sigma, sat = 1) {
  const a = target(), b = target();
  gl.useProgram(BLUR); gl.viewport(0, 0, W, H); gl.disable(gl.BLEND);
  gl.uniform2f(U(BLUR, 'uRes'), W, H); gl.uniform1i(U(BLUR, 'uT'), 0); gl.activeTexture(gl.TEXTURE0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, a.f); gl.bindTexture(gl.TEXTURE_2D, src);
  gl.uniform2f(U(BLUR, 'uDir'), 1, 0); gl.uniform1f(U(BLUR, 'uSigma'), sigma); gl.uniform1f(U(BLUR, 'uSat'), 1); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.bindTexture(gl.TEXTURE_2D, a.t);
  gl.uniform2f(U(BLUR, 'uDir'), 0, 1); gl.uniform1f(U(BLUR, 'uSat'), sat); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  return b.t;
}

const COMMON = `#version 300 es
precision highp float; out vec4 outColor; uniform vec2 uRes;
vec2 domPx(){ return vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y); }
`;
const BLIT = compile(COMMON + `uniform sampler2D uT; void main(){ outColor = texture(uT, domPx()/uRes); }`);

// ---- K: Kyant0 AndroidLiquidGlass (Apache-2.0), AGSL ported 1:1 + Highlight.Default stroke ----
const KYANT = compile(COMMON + `
uniform sampler2D content; uniform vec2 topLeft; uniform vec2 size; uniform vec4 cornerRadii;
uniform float refractionHeight; uniform float refractionAmount; uniform float depthEffect;
uniform float hlWidth; uniform float hlBlur; uniform float hlAlpha; uniform float hlShaded; uniform float angle;
float radiusAt(vec2 coord, vec4 radii){ if (coord.x>=0.){ if(coord.y<=0.) return radii.y; else return radii.z;} else { if(coord.y<=0.) return radii.x; else return radii.w; } }
float sdRoundedRect(vec2 coord, vec2 halfSize, float radius){ vec2 cc = abs(coord)-(halfSize-vec2(radius)); float outside = length(max(cc,0.))-radius; float inside = min(max(cc.x,cc.y),0.); return outside+inside; }
vec2 gradSdRoundedRect(vec2 coord, vec2 halfSize, float radius){ vec2 cc = abs(coord)-(halfSize-vec2(radius));
  if (cc.x>=0. || cc.y>=0.) return sign(coord)*normalize(max(cc,0.)); float gx = step(cc.y,cc.x); return sign(coord)*vec2(gx,1.-gx); }
float circleMap(float x){ return 1.-sqrt(1.-x*x); }
vec4 eval(vec2 coord){ return texture(content, (topLeft+coord)/uRes); }
void main(){
  vec2 coord = domPx()-topLeft; vec2 halfSize = size*.5; vec2 cc = coord-halfSize;
  float radius = radiusAt(cc, cornerRadii);
  float sd0 = sdRoundedRect(cc, halfSize, radius);
  float cover = clamp(0.5-sd0, 0., 1.);
  if (cover<=0.) discard;
  vec4 col;
  float sd = sd0;
  if (-sd >= refractionHeight) col = eval(coord);
  else { sd = min(sd,0.);
    float d = circleMap(1.-(-sd)/refractionHeight)*refractionAmount;
    float gradRadius = min(radius*1.5, min(halfSize.x,halfSize.y));
    vec2 grad = normalize(gradSdRoundedRect(cc, halfSize, gradRadius) + depthEffect*normalize(cc));
    col = eval(coord + d*grad); }
  // Highlight: stroke of 2*width clipped to the shape => inner band 'width', Gaussian-blurred by hlBlur, blend Plus.
  float t = -sd0;
  float band = smoothstep(-hlBlur, hlBlur, t) * (1.-smoothstep(hlWidth-hlBlur, hlWidth+hlBlur, t));
  float gradRadius = min(radius*1.5, min(halfSize.x,halfSize.y));
  vec2 g = gradSdRoundedRect(cc, halfSize, gradRadius);
  float inten = hlShaded>0.5 ? abs(dot(g, vec2(cos(angle), sin(angle)))) : 1.0;
  col.rgb += vec3(1.)*hlAlpha*inten*band;
  outColor = vec4(min(col.rgb,1.)*cover, cover);
}`);

// ---- Y: ybouane/liquidglass (MIT) FS_GLASS ported 1:1 (CSS-px space, DOM-oriented UV) ----
const YB = compile(COMMON + `
uniform sampler2D u_bgTex; uniform sampler2D u_blurTex; uniform vec2 u_size; uniform float u_radius; uniform vec2 u_center; uniform float u_dpr;
uniform float u_refract,u_chroma,u_edgeHL,u_spec,u_fresnel,u_distort,u_alpha,u_sat,u_tint,u_zRadius,u_brightness,u_bevelMode;
float rrSDF(vec2 p, vec2 b, float r){ vec2 q = abs(p)-b+vec2(r); return min(max(q.x,q.y),0.)+length(max(q,vec2(0.)))-r; }
float bevelHeight(float d, float zR){ if(d<=0.) return 0.; if(d>=zR) return zR; return sqrt(d*(2.*zR-d)); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec2 px = domPx(); vec2 v_localPx = (px - u_center)/u_dpr; vec2 v_screenUV = px/uRes; vec2 u_resCss = uRes/u_dpr;
  vec2 half_ = u_size*.5; float r = min(u_radius, min(half_.x,half_.y)); float sdf = rrSDF(v_localPx, half_, r);
  if (sdf > 0.5) discard;
  float mask = 1.0 - smoothstep(-1.5, 0.5, sdf);
  float maxD = min(half_.x,half_.y); float inside = -sdf; float edge = smoothstep(maxD*0.35, 0.0, inside);
  float zR = u_zRadius; float e = 2.0;
  float dC = inside; float dR = -rrSDF(v_localPx+vec2(e,0.),half_,r); float dL = -rrSDF(v_localPx-vec2(e,0.),half_,r);
  float dU = -rrSDF(v_localPx+vec2(0.,e),half_,r); float dD = -rrSDF(v_localPx-vec2(0.,e),half_,r);
  float hC = bevelHeight(dC,zR), hR = bevelHeight(dR,zR), hL = bevelHeight(dL,zR), hU = bevelHeight(dU,zR), hD = bevelHeight(dD,zR);
  vec2 hGrad = vec2(hR-hL, hU-hD)/(2.*e); vec3 N = normalize(vec3(-hGrad,1.));
  float depth = smoothstep(0.,zR,inside);
  vec2 pxToUV = vec2(1.0)/u_resCss; // DOM-oriented texture: no y flip
  float ior = 1.5; float refrPow = 1.-1./ior; float thickness = hC*2.; float thickNorm = thickness/max(zR*2.,1.);
  vec2 refrPx;
  if (u_bevelMode < 0.5) { vec2 exitRefr = hGrad*refrPow; vec2 entryRefr = hGrad*refrPow; vec2 throughRefr = entryRefr*thickNorm*0.5;
    refrPx = (exitRefr+entryRefr+throughRefr)*u_refract*30.; vec2 centerDir = -v_localPx/max(half_,vec2(1.)); refrPx += centerDir*u_refract*4.*depth;
  } else { refrPx = -v_localPx*u_refract*depth*0.35; }
  vec2 refr = refrPx*pxToUV;
  vec2 ns = v_localPx*0.08; vec2 micro = (vec2(hash(ns),hash(ns+vec2(37.)))-0.5)*u_distort*4.*pxToUV;
  float caS = u_chroma*18.*(edge*0.7+0.3)*2.; vec2 caD = N.xy*caS*pxToUV; vec2 base = v_screenUV+refr+micro;
  vec3 sharp = vec3(texture(u_bgTex,base+caD).r, texture(u_bgTex,base).g, texture(u_bgTex,base-caD).b);
  vec3 blur = vec3(texture(u_blurTex,base+caD).r, texture(u_blurTex,base).g, texture(u_blurTex,base-caD).b);
  float edgeMix = (1.0 - edge*0.15); vec3 col = mix(sharp, blur, edgeMix);
  col *= 1.0+u_brightness; float lum = dot(col, vec3(0.299,0.587,0.114)); col = mix(vec3(lum), col, 1.0+u_sat);
  col = mix(col, col*vec3(0.92,0.95,1.05), u_tint); col *= 1.0+0.06*depth;
  float fres = pow(1.0-abs(N.z),4.)*u_fresnel;
  vec3 V = vec3(0,0,1); vec3 L1 = normalize(vec3(0.4,0.7,1.)); vec3 H1 = normalize(L1+V); float sp1 = pow(max(dot(N,H1),0.),90.);
  vec3 L2 = normalize(vec3(-0.3,-0.5,1.)); vec3 H2 = normalize(L2+V); float sp2 = pow(max(dot(N,H2),0.),50.)*0.3;
  vec3 L3 = normalize(vec3(0.1,0.3,1.)); float spB = pow(max(dot(N,L3),0.),6.)*0.1;
  vec3 L4 = normalize(vec3(0.,0.9,0.4)); vec3 H4 = normalize(L4+V); float sp4 = pow(max(dot(N,H4),0.),120.)*0.6;
  float totalSpec = (sp1+sp2+spB+sp4)*u_spec;
  float borderWidth = 1.5; float innerStroke = smoothstep(-borderWidth-1.,-borderWidth,sdf)*(1.-smoothstep(-1.,0.,sdf));
  float topBias = 0.5+0.5*(-v_localPx.y/half_.y); innerStroke *= (0.4+0.6*topBias);
  float rim = edge*u_edgeHL*0.22; float innerGlow = smoothstep(5.,0.,-sdf)*u_edgeHL*0.15;
  float envRefl = (N.y*0.5+0.5)*fres*0.08;
  vec3 fin = col + vec3(totalSpec) + vec3(rim+innerGlow) + vec3(innerStroke*u_edgeHL*0.55) + vec3(envRefl);
  fin = mix(fin, vec3(1.), fres*0.2);
  float a = mask*u_alpha; outColor = vec4(fin*a, a);
}`);

// ---- O: Oliverrr2424/webgl-apple-liquid-glass (MIT) V2 shader, verbatim; only the fragment position is DOM-oriented ----
const O_SRC = FS_GLASS_V2.replace('vec2 point = vUV * uRes;', 'vec2 point = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);').replace('in vec2 vUV;', '');
const OLI = compile(O_SRC);

// ---- R: recommended single-read model ----
const REC = compile(COMMON + `
uniform sampler2D uBody;   // backdrop at the body blur level
uniform sampler2D uEdge;   // one level softer, read only inside the squeeze band
uniform vec2 uCenter, uHalf; uniform float uRadius, uDpr, uLens, uMag, uSat, uLift, uRimGain, uRimWhite, uRimLobe, uClear;
uniform vec2 uLight; uniform float uEdgeMix; uniform float uA; uniform float uC; uniform float uDebug;
float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p)-b+r; return min(max(q.x,q.y),0.)+length(max(q,0.))-r; }
vec2 nRR(vec2 p, vec2 b, float r){ vec2 q = abs(p)-b+r; vec2 g = (q.x>0.&&q.y>0.) ? normalize(q) : (q.x>q.y ? vec2(1,0) : vec2(0,1)); return g*sign(p); }
void main(){
  vec2 px = domPx(); vec2 p = px-uCenter;
  float d = sdRR(p, uHalf, uRadius);
  float cover = clamp(0.5-d, 0., 1.); if (cover<=0.) discard;
  float minHalf = min(uHalf.x, uHalf.y);
  // Normal from a SOFTENED field (corner radius grown to the band) so the displacement never creases on the corner diagonal.
  float B = clamp(0.8*minHalf, 8.*uDpr, 28.*uDpr);        // lens band
  vec2 N = nRR(p, uHalf, max(uRadius, min(B*1.5, minHalf)));
  float x = clamp(-d/B, 0., 1.); float k = 1.-x;
  float beta = uC - 1. + 2.*uA;                          // off(x)/B = k^2 (a + beta x): off(0)=aB, slope c at the rim
  float off = B*k*k*(uA + beta*x);
  float squeeze = 1. + k*(beta*k - 2.*(uA + beta*x));    // ds/dt, must stay > 0
  vec2 s = px - N*off - p*uMag;
  vec3 c = texture(uBody, s/uRes).rgb;
  if (uEdgeMix > 0.5 && squeeze < 0.35) c = mix(c, texture(uEdge, s/uRes).rgb, smoothstep(0.35, 0.05, squeeze));
  if (uDebug > 0.5) c = squeeze <= 0. ? vec3(1,0,0) : vec3(squeeze*0.25);
  // Regular material: lift and saturate the transmitted light.
  float l = dot(c, vec3(0.2126,0.7152,0.0722));
  c = mix(vec3(l), c, uSat); c = c*(1.-uLift) + uLift;
  // Rim: constant ~2.5 native px core with a short tail; lifted, saturated copy of what is under it.
  float t = max(-d, 0.);
  float w = exp(-max(t-0.6*uDpr, 0.)/(0.55*uDpr));
  float lobe = pow(abs(dot(N, uLight)), 2.0);
  vec3 rimC = mix(min(c*uRimGain, 1.), vec3(1.), uRimWhite + uRimLobe*lobe);
  c = mix(c, rimC, w*(0.65+0.35*lobe));
  outColor = vec4(c*cover, cover);
}`);

function draw(prog, setup) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.useProgram(prog); gl.uniform2f(U(prog, 'uRes'), W, H); setup(prog); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function bind(prog, name, unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U(prog, name), unit); }

const img = new Image(); img.src = `bg-${BG}.png`; await img.decode();
const sharp = texFrom(img, false, false);
const frost = Q.get('frost') !== null ? parseFloat(Q.get('frost')) : 1;

gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.disable(gl.BLEND);
gl.useProgram(BLIT); gl.uniform2f(U(BLIT, 'uRes'), W, H); bind(BLIT, 'uT', 0, sharp); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

const dp = DPR; // 1dp == 1 CSS px here
const skiaSigma = (r) => r > 0 ? r * 0.57735 + 0.5 : 0;
if (MODEL === 'K') {
  // Pill = LiquidButton: vibrancy, blur(2dp), lens(12dp, 24dp), Highlight.Default. Panel = Dialog (dark): sat 1.5, blur(8dp), lens(24dp, 48dp, depth), Highlight.Plain.
  const pillTex = blurred(sharp, skiaSigma(2 * dp), 1.5);
  const panelTex = blurred(sharp, skiaSigma(8 * dp), 1.5);
  SHAPES.forEach((s, i) => draw(KYANT, (p) => {
    bind(p, 'content', 0, i === 0 ? pillTex : panelTex);
    gl.uniform2f(U(p, 'topLeft'), s.cx - s.hx, s.cy - s.hy); gl.uniform2f(U(p, 'size'), 2 * s.hx, 2 * s.hy);
    gl.uniform4f(U(p, 'cornerRadii'), s.r, s.r, s.r, s.r);
    gl.uniform1f(U(p, 'refractionHeight'), (i === 0 ? 12 : 24) * dp); gl.uniform1f(U(p, 'refractionAmount'), -(i === 0 ? 24 : 48) * dp);
    gl.uniform1f(U(p, 'depthEffect'), i === 0 ? 0 : 1);
    gl.uniform1f(U(p, 'hlWidth'), 0.5 * dp); gl.uniform1f(U(p, 'hlBlur'), 0.25 * dp);
    gl.uniform1f(U(p, 'hlAlpha'), i === 0 ? 0.5 : 0.38); gl.uniform1f(U(p, 'hlShaded'), i === 0 ? 1 : 0); gl.uniform1f(U(p, 'angle'), Math.PI / 4);
  }));
} else if (MODEL === 'Y') {
  SHAPES.forEach((s) => draw(YB, (p) => {
    bind(p, 'u_bgTex', 0, sharp); bind(p, 'u_blurTex', 1, sharp); // defaults: blurAmount 0
    gl.uniform2f(U(p, 'u_size'), 2 * s.hx / DPR, 2 * s.hy / DPR); gl.uniform1f(U(p, 'u_radius'), s.capsule ? 999 : 65);
    gl.uniform2f(U(p, 'u_center'), s.cx, s.cy); gl.uniform1f(U(p, 'u_dpr'), DPR);
    const d = { u_refract: 0.69, u_chroma: 0.05, u_edgeHL: 0.05, u_spec: 0, u_fresnel: 1, u_distort: 0, u_alpha: 1, u_sat: 0, u_tint: 0, u_zRadius: 40, u_brightness: 0, u_bevelMode: 0 };
    for (const k in d) gl.uniform1f(U(p, k), d[k]);
  }));
} else if (MODEL === 'O') {
  const lin = texFrom(img, true, true);
  const a = 136 * Math.PI / 180, light = [Math.cos(a), -Math.sin(a)];
  const m = { refraction: 84, edgeReach: 0.14, edgeWidth: 0.21, dispersion: 2.0, body: 0.72, absorption: 0.58, rim: 0.24, reflection: 0.31, highlight: 0.34, echo: 0.28, hairline: 0.92, hairWidth: 0.52 };
  draw(OLI, (p) => {
    bind(p, 'uSrc', 0, lin); gl.uniform1f(U(p, 'uDpr'), DPR); gl.uniform1f(U(p, 'uMips'), Math.floor(Math.log2(Math.max(W, H))) + 1);
    gl.uniform1f(U(p, 'uBackdropBlur'), 0); gl.uniform1i(U(p, 'uShapeCount'), 2);
    gl.uniform2fv(U(p, 'uShapeCenters'), SHAPES.flatMap(s => [s.cx, s.cy])); gl.uniform2fv(U(p, 'uShapeHalves'), SHAPES.flatMap(s => [s.hx, s.hy]));
    gl.uniform1iv(U(p, 'uShapeTypes'), SHAPES.map(s => s.capsule ? 1 : 0)); gl.uniform1fv(U(p, 'uShapeRadii'), SHAPES.map(s => s.r));
    gl.uniform1fv(U(p, 'uShapeTints'), [0, 0]); gl.uniform1fv(U(p, 'uShapeTintLights'), [1, 1]); gl.uniform1fv(U(p, 'uShapeFrosts'), [frost * 0.3, frost * 0.3]);
    gl.uniform1fv(U(p, 'uShapeOpacities'), [1, 1]); gl.uniform1fv(U(p, 'uShapePressures'), [0, 0]); gl.uniform2fv(U(p, 'uShapePressAxes'), [1, 1, 1, 1]);
    gl.uniform2fv(U(p, 'uLightDirs'), [...light, ...light]);
    gl.uniform1f(U(p, 'uRefraction'), m.refraction * DPR);
    for (const k of ['edgeReach', 'edgeWidth', 'dispersion', 'body', 'absorption', 'rim', 'reflection', 'highlight', 'echo', 'hairline', 'hairWidth'])
      gl.uniform1f(U(p, 'u' + k[0].toUpperCase() + k.slice(1)), m[k]);
  });
} else if (MODEL === 'R') {
  // Body blur per size: sigma = clamp(0.045*minHalf, 1.5, 6) CSS px (regular); edge band reads one level softer (x2).
  SHAPES.forEach((s) => {
    const minHalfCss = Math.min(s.hx, s.hy) / DPR;
    const sig = frost * Math.min(Math.max(0.045 * minHalfCss, 1.5), 6) * DPR;
    const body = blurred(sharp, sig), edge = blurred(sharp, sig * 1.6 + 1.5 * DPR);
    draw(REC, (p) => {
      bind(p, 'uBody', 0, body); bind(p, 'uEdge', 1, edge);
      gl.uniform2f(U(p, 'uCenter'), s.cx, s.cy); gl.uniform2f(U(p, 'uHalf'), s.hx, s.hy); gl.uniform1f(U(p, 'uRadius'), s.r);
      gl.uniform1f(U(p, 'uDpr'), DPR);
      const big = Math.min(1, Math.max(0, (minHalfCss - 24) / 56));
